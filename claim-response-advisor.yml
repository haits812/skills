        desc: ''
        model:
          completion_params:
            temperature: 0.4
          mode: chat
          name: gpt-4o
          provider: openai
        prompt_template:
        - id: a1b2c3d4-0003-4000-8000-000000000001
          role: system
          text: "あなたはBPO企業のクレーム対応担当者です。\n深刻度「中」または「低」のクレームに対し、以下の構成で対応案を作成してください。\n\
            \n## 出力フォーマット\n\n### 📊 分析結果\n（前段の分析結果をそのまま転記）\n\n### 📋 対応方針\n- 推奨する対応アクション（3〜5項目）\n\
            - 対応期限の目安\n\n### ✉️ 返信ドラフト\n- 丁寧な受領確認\n- 改善意思の表明\n- 具体的な対応内容"
        - id: a1b2c3d4-0003-4000-8000-000000000002
          role: user
          text: "以下のクレーム分析結果と原文に基づいて対応案を作成してください。\n対応チャネルは「{{#1700000000001.channel#}}」です。\n\
            お客様名は「{{#1700000000001.customer_name#}}」です（空欄の場合は「お客様」としてください）。\n\n【分析結果】\n\
            {{#1700000000002.text#}}\n\n【クレーム原文】\n{{#1700000000001.claim_text#}}"
        selected: false
        title: 通常クレーム対応
        type: llm

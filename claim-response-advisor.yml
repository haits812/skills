app:
  description: 'クレーム文を入力すると、感情分析・深刻度判定・カテゴリ分類を行い、深刻度に応じた対応方針と返信ドラフトを生成します。'
  icon: "\U0001F6A8"
  icon_background: '#FF4D4F'
  mode: workflow
  name: クレーム対応アドバイザー
  use_icon_as_answer_icon: false
kind: app
version: 0.1.3
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
      fileUploadConfig:
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        image_file_size_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        sourceType: start
        targetType: llm
      id: 1700000000001-source-1700000000002-target
      source: '1700000000001'
      sourceHandle: source
      target: '1700000000002'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: llm
        targetType: if-else
      id: 1700000000002-source-1700000000003-target
      source: '1700000000002'
      sourceHandle: source
      target: '1700000000003'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: if-else
        targetType: llm
      id: 1700000000003-true-1700000000004-target
      source: '1700000000003'
      sourceHandle: 'true'
      target: '1700000000004'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: if-else
        targetType: llm
      id: 1700000000003-false-1700000000005-target
      source: '1700000000003'
      sourceHandle: 'false'
      target: '1700000000005'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: llm
        targetType: template-transform
      id: 1700000000004-source-1700000000006-target
      source: '1700000000004'
      sourceHandle: source
      target: '1700000000006'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: llm
        targetType: template-transform
      id: 1700000000005-source-1700000000007-target
      source: '1700000000005'
      sourceHandle: source
      target: '1700000000007'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: template-transform
        targetType: end
      id: 1700000000006-source-1700000000008-target
      source: '1700000000006'
      sourceHandle: source
      target: '1700000000008'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: template-transform
        targetType: end
      id: 1700000000007-source-1700000000008-target
      source: '1700000000007'
      sourceHandle: source
      target: '1700000000008'
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: ''
        selected: false
        title: 開始
        type: start
        variables:
        - label: "\U0001F4E9 クレーム内容を貼り付けてください"
          max_length: 5000
          options: []
          required: true
          type: paragraph
          variable: claim_text
        - label: "\U0001F464 お客様名（任意）"
          max_length: 100
          options: []
          required: false
          type: text-input
          variable: customer_name
        - label: "\U0001F4DE 対応チャネル"
          max_length: 48
          options:
          - メール
          - 電話
          - チャット
          - 対面
          required: true
          type: select
          variable: channel
      height: 142
      id: '1700000000001'
      position:
        x: 80
        y: 282
      positionAbsolute:
        x: 80
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: ''
        model:
          completion_params:
            temperature: 0.2
          mode: chat
          name: gpt-4o
          provider: openai
        prompt_template:
        - id: a1b2c3d4-0001-4000-8000-000000000001
          role: system
          text: "あなたはBPO企業のクレーム対応エキスパートです。\nクレーム文を分析し、以下のフォーマットで正確に出力してください。\n\
            フォーマット以外のテキストは一切出力しないでください。\n\n【感情】怒り / 不満 / 困惑 / 失望 のいずれか1つ\n【深刻度】高\
            \ / 中 / 低 のいずれか1つ\n【カテゴリ】品質問題 / 対応不備 / 納期遅延 / 請求トラブル / その他 のいずれか1つ\n\
            【要点】クレームの核心を1-2文で要約\n\n深刻度の判定基準:\n- 高: 法的措置の示唆、取引停止の可能性、人身への影響、メディア露出リスク、経営層への言及\n\
            - 中: 明確な不満表明、改善要求、金銭的補償の要求\n- 低: 軽微な指摘、改善提案、確認・問い合わせレベル"
        - id: a1b2c3d4-0001-4000-8000-000000000002
          role: user
          text: "以下のクレーム内容を分析してください。\n\n{{#1700000000001.claim_text#}}"
        selected: false
        title: クレーム分析
        type: llm
        variables: []
        vision:
          configs:
            detail: high
          enabled: false
      height: 98
      id: '1700000000002'
      position:
        x: 400
        y: 282
      positionAbsolute:
        x: 400
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        conditions:
        - comparison_operator: contains
          id: cond-001
          value: "\u9AD8"
          variable_selector:
          - '1700000000002'
          - text
        desc: ''
        logical_operator: and
        selected: false
        title: 深刻度チェック
        type: if-else
      height: 126
      id: '1700000000003'
      position:
        x: 720
        y: 282
      positionAbsolute:
        x: 720
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: ''
        model:
          completion_params:
            temperature: 0.3
          mode: chat
          name: gpt-4o
          provider: openai
        prompt_template:
        - id: a1b2c3d4-0002-4000-8000-000000000001
          role: system
          text: "あなたはBPO企業の上級クレーム対応スペシャリストです。\n深刻度「高」のクレームに対し、以下の構成で丁寧かつ慎重な対応案を作成してください。\n\
            \n## 出力フォーマット\n\n### 📊 分析結果\n（前段の分析結果をそのまま転記）\n\n### 🚨 リスク評価\n- このクレームが持つ潜在リスクを具体的に記載\n\
            - エスカレーション先の提案（上長・法務・品質管理部門など）\n\n### 📋 対応方針\n1. 初動対応（24時間以内にすべきこと）\n\
            2. 中期対応（1週間以内にすべきこと）\n3. 再発防止策の提案\n\n### ✉️ 返信ドラフト\n- 誠意ある謝罪から始める\n\
            - 事実確認の姿勢を示す\n- 具体的な対応スケジュールを提示\n- 責任者の関与を明示する"
        - id: a1b2c3d4-0002-4000-8000-000000000002
          role: user
          text: "以下のクレーム分析結果と原文に基づいて対応案を作成してください。\n対応チャネルは「{{#1700000000001.channel#}}」です。\n\
            お客様名は「{{#1700000000001.customer_name#}}」です（空欄の場合は「お客様」としてください）。\n\n【分析結果】\n\
            {{#1700000000002.text#}}\n\n【クレーム原文】\n{{#1700000000001.claim_text#}}"
        selected: false
        title: 重大クレーム対応
        type: llm
        variables: []
        vision:
          configs:
            detail: high
          enabled: false
      height: 98
      id: '1700000000004'
      position:
        x: 1060
        y: 120
      positionAbsolute:
        x: 1060
        y: 120
